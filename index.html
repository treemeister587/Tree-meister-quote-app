<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2f6f3e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tree Quotes"><title>Tree Meister Quote App</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f5f6f3;color:#172018}.wrap{max-width:860px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d8ddd7;border-radius:16px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}@media(max-width:650px){.grid,.grid4{grid-template-columns:1fr 1fr}}label{display:block;font-size:13px;color:#667067;margin-bottom:4px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d8ddd7;border-radius:10px;font-size:16px}textarea{min-height:70px}button{border:1px solid #d8ddd7;background:#fff;border-radius:10px;padding:11px;min-height:44px}.primary,.active{background:#2f6f3e;color:white;border-color:#2f6f3e}.row,.space{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between;align-items:flex-start}.muted{color:#667067}.hidden{display:none}.check{display:flex;gap:8px;align-items:center;margin:8px 0}.check input{width:auto}.item{border:1px solid #d8ddd7;border-radius:12px;padding:12px;margin-top:10px}.desc{white-space:pre-wrap;line-height:1.45;margin:8px 0}.price{font-size:20px;font-weight:800}.total{font-size:26px;font-weight:900}.small{padding:8px 10px;min-height:38px}.danger{color:#a43838}</style></head><body><div class="wrap"><h1>Tree Meister Quote App</h1><p class="muted">Saved jobs stay on this device.</p><div class="card"><div class="space"><strong>Saved jobs</strong><button id="newJob" class="small primary">New job</button></div><div class="grid" style="margin-top:10px"><div><label>Current job name</label><input id="jobName" placeholder="Smith - Oak St"></div><div><label>Open saved job</label><select id="jobSelect"></select></div></div><div class="row" style="margin-top:10px"><button id="saveJob" class="small primary">Save job</button><button id="deleteJob" class="small danger">Delete current job</button><span id="jobStatus" class="muted"></span></div></div><details class="card"><summary><strong>Rates & pricing</strong></summary><div class="grid" style="margin-top:10px"><div><label>Removal $/hr</label><input id="rateRemoval" type="number"></div><div><label>Trimming $/hr</label><input id="rateTrim" type="number"></div><div><label>Stump $/hr</label><input id="rateStump" type="number"></div><div><label>Cabling $/hr</label><input id="rateCable" type="number"></div></div></details><div class="card"><strong>Add line item</strong><div class="grid4" style="margin-top:10px"><button class="typeBtn active" data-type="Removal">Removal</button><button class="typeBtn" data-type="Trim">Trim</button><button class="typeBtn" data-type="Cable">Cable</button><button class="typeBtn" data-type="Stump">Stump</button></div><div class="grid" style="margin-top:10px"><div><label>Estimated hours</label><input id="hours" type="number" min="0" step=".25"></div><div><label>Tree & location</label><input id="treeLocation" placeholder="Sugar maple in backyard"></div></div><div id="removalOptions" style="margin-top:10px"><div class="grid"><div><label>Stump height (inches)</label><input id="stumpHeight" type="number" value="6"></div><div><label>Brush & log handling</label><select id="removalDebris"><option value="haul">Haul all brush & logs</option><option value="leaveAll">Leave all</option><option value="leaveLogs">Leaving logs</option><option value="leaveRounds">Leaving rounds</option></select></div></div></div><div id="trimOptions" class="hidden" style="margin-top:10px"><label class="check"><input id="dead2" type="checkbox">Removing any deadwood 2” or bigger.</label><label class="check"><input id="deadAll" type="checkbox">Removing any deadwood.</label><div class="grid"><label class="check"><input id="raiseCanopy" type="checkbox">Raise canopy to:</label><input id="canopyHeight" placeholder="8’"></div><label class="check"><input id="suckers" type="checkbox">Removing the lower suckers.</label><label class="check"><input id="marked" type="checkbox">Removing the marked limbs.</label><div class="grid"><label class="check"><input id="houseClear" type="checkbox">House clearance by:</label><input id="houseDistance" placeholder="4’"></div><div class="grid"><label class="check"><input id="otherTreeClear" type="checkbox">Trim around other tree by:</label><input id="otherTreeDistance" placeholder="4’"></div><label class="check"><input id="video" type="checkbox" checked>Video will show more detail.</label><label>Brush & log handling</label><select id="trimDebris"><option value="haul">Haul all trimming debris</option><option value="leaveAll">Leave all</option><option value="leaveLogs">Leaving logs</option><option value="leaveRounds">Leaving rounds</option></select><label style="margin-top:8px">Other trimming detail</label><input id="trimOther"></div><div id="stumpOptions" class="hidden" style="margin-top:10px"><label>Mulch handling</label><select id="mulch"><option value="haul">Haul excess mulch</option><option value="leave">Leave excess mulch</option></select></div><div id="cableOptions" class="hidden" style="margin-top:10px"><label>Cable location / union</label><input id="cableLocation"></div><label style="margin-top:10px">Extra notes</label><textarea id="notes"></textarea><div class="row" style="margin-top:10px"><button id="addItem" class="primary">Add line item</button><span id="status" class="muted"></span></div></div><details class="card"><summary><strong>Crane pricing</strong></summary><div class="grid" style="margin-top:10px"><div><label>Crane $/hr</label><input id="craneRate" type="number"></div><div><label>Number of picks</label><input id="cranePicks" type="number" value="0"></div><div><label>Time per pick (hr)</label><input id="craneTimePerPick" type="number" step=".05" value=".25"></div><div><label>Travel time (hr)</label><input id="craneTravel" type="number" step=".25" value="0"></div></div><div class="space" style="margin-top:10px"><span>Crane time: <strong id="craneHours">0 hr</strong></span><span>Cost: <strong id="craneCost">$0.00</strong></span></div><button id="addCrane" class="primary" style="margin-top:10px">Add crane line item</button></details><div class="card"><div class="space"><div><strong>Quote line items</strong><div class="muted">Copy each description into Jobber.</div></div><button id="clearAll" class="small danger">Clear all</button></div><div id="items"></div></div><div class="card"><div class="space"><span>Total estimated hours: <strong id="totalHours">0 hr</strong></span><span class="total" id="grandTotal">$0.00</span></div></div></div><script src="app.js"></script></body></html>
